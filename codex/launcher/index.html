<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      main {
        box-sizing: border-box;
        max-width: 760px;
        padding: 32px;
        width: 100%;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 8px;
      }
      p {
        color: #cbd5e1;
        line-height: 1.5;
        margin: 0 0 28px;
      }
      nav {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
      a {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 12px;
        color: inherit;
        padding: 24px;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        border-color: #60a5fa;
        outline: none;
        transform: translateY(-1px);
      }
      strong,
      span {
        display: block;
      }
      strong {
        font-size: 1.2rem;
        margin-bottom: 8px;
      }
      span {
        color: #94a3b8;
        line-height: 1.4;
      }
      .primary {
        border-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Codex</h1>
      <p>Choose the main development interface or the independent recovery console.</p>
      <nav aria-label="Codex interfaces">
        <a class="primary" href="vscode/">
          <strong>VS Code</strong>
          <span>Files, editor, search, Git, terminal, and the experimental Codex extension.</span>
        </a>
        <a href="console/">
          <strong>Console</strong>
          <span>Fallback root shell that remains available if code-server fails.</span>
        </a>
      </nav>
    </main>
  </body>
</html>
