user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Never include query strings or authorization data in container logs.
    log_format codex_safe '$remote_addr - [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent';
    access_log /dev/stdout codex_safe;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 0.0.0.0:8099;
        server_name _;
        client_max_body_size 0;

        # Home Assistant's Ingress proxy is the only network peer allowed to
        # reach the gateway. Loopback remains available for local health checks.
        allow 127.0.0.1;
        allow 172.30.32.2;
        deny all;

        location = / {
            root /usr/local/share/codex-app/launcher;
            try_files /index.html =404;
        }

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        # Container/gateway liveness only. A broken Codex extension or a
        # restarting code-server must not make the whole App unhealthy.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /health/code-server {
            access_log off;
            proxy_pass http://127.0.0.1:1337/healthz;
        }

        location = /health/console {
            access_log off;
            proxy_pass http://127.0.0.1:8100/console/;
            proxy_set_header Authorization "__TTYD_AUTHORIZATION__";
        }

        location = /health/codex {
            access_log off;
            alias /run/codex-app/health/codex;
            default_type text/plain;
        }

        location = /vscode {
            return 302 ./vscode/;
        }

        # Keep /vscode in the upstream URI. code-server derives its base path
        # from the request, which makes static assets and WebSockets work under
        # both this prefix and Home Assistant's dynamic Ingress prefix.
        location ^~ /vscode/ {
            proxy_pass http://127.0.0.1:1337;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /console {
            return 302 ./console/;
        }

        location ^~ /console/ {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "__TTYD_AUTHORIZATION__";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
