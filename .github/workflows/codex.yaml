name: Build Codex App

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/codex.yaml"
      - "codex/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex.yaml"
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: codex-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-24.04
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.metadata.outputs.description }}
      image_name: ${{ steps.metadata.outputs.image_name }}
      name: ${{ steps.metadata.outputs.name }}
      registry_prefix: ${{ steps.metadata.outputs.registry_prefix }}
      url: ${{ steps.metadata.outputs.url }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Read App metadata
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./codex

      - name: Validate and normalize metadata
        id: metadata
        shell: bash
        env:
          APP_DESCRIPTION: ${{ steps.info.outputs.description }}
          APP_IMAGE: ${{ steps.info.outputs.image }}
          APP_NAME: ${{ steps.info.outputs.name }}
          APP_URL: ${{ steps.info.outputs.url }}
          APP_VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail

          decode_string() {
            jq -er 'if type == "string" then . else error("expected a JSON string") end' <<< "$1"
          }

          app_description="$(decode_string "${APP_DESCRIPTION}")"
          app_image="$(decode_string "${APP_IMAGE}")"
          app_name="$(decode_string "${APP_NAME}")"
          app_url="$(decode_string "${APP_URL}")"
          app_version="$(decode_string "${APP_VERSION}")"

          if [[ ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid App version: ${app_version}" >&2
            exit 1
          fi
          if [[ "${app_image}" != ghcr.io/zoic21/* ]]; then
            echo "Unexpected image registry or owner: ${app_image}" >&2
            exit 1
          fi

          echo "description=${app_description}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${app_image##*/}" >> "${GITHUB_OUTPUT}"
          echo "name=${app_name}" >> "${GITHUB_OUTPUT}"
          echo "registry_prefix=${app_image%/*}" >> "${GITHUB_OUTPUT}"
          echo "url=${app_url}" >> "${GITHUB_OUTPUT}"
          echo "version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.metadata.outputs.image_name }}
          registry-prefix: ${{ steps.metadata.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          cache-gha-scope: codex-${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./codex
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name != 'pull_request' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs:
      - prepare
      - build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
